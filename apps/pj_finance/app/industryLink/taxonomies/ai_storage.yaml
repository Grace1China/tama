上游_存储芯片与接口:
  DRAM_HBM与内存接口:
    产业位置: AI训练和推理的高带宽内存、服务器内存接口和缓存芯片基础环节，决定算力平台的数据吞吐上限
    确定性: 中高
    弹性: 高
    弹性因子:
    - AI训练和推理对内存带宽的刚性需求
    - DDR5、MRDIMM、CXL与HBM平台升级节奏
    - 国产服务器和智算中心渗透率提升
    - 海外DRAM价格周期和大厂资本开支
    公司:
    - 澜起科技:
        info:
          入选说明: 内存接口芯片龙头，产品覆盖DDR5寄存时钟驱动、内存模组配套芯片和互连芯片方向
          产业作用: 为AI服务器内存子系统提供接口和互连能力，是服务器平台升级的重要受益环节
          确定性: 高
          弹性: 高
          理由:
          - DDR5渗透率提升带来代际升级
          - AI服务器单机内存容量和带宽需求高于传统服务器
          - CXL、MRDIMM等新形态可能打开增量空间
          风险:
          - 内存周期下行压制模组出货
          - 新平台认证节奏不及预期
        link:
          浪潮信息: AI服务器客户方向
          工业富联: AI服务器制造协同
          聚辰股份: 内存模组配套芯片协同
          兆易创新: 存储芯片国产化协同
    - 聚辰股份:
        info:
          入选说明: EEPROM和内存模组配套芯片厂商，布局SPD、温度传感等服务器内存相关芯片
          产业作用: 为内存模组提供识别、管理和可靠性相关芯片，受益于DDR5和服务器内存升级
          确定性: 中高
          弹性: 中高
          理由:
          - DDR5模组所需配套芯片价值量提升
          - 服务器和AI PC内存升级带来需求弹性
          风险:
          - 消费电子和内存模组库存波动
          - 海外竞品价格竞争
        link:
          澜起科技: 内存模组接口协同
          佰维存储: 内存模组客户方向
          江波龙: 存储模组客户方向
    - 兆易创新:
        info:
          入选说明: 国内NOR Flash、MCU和存储产品代表公司，兼具工业和消费终端客户基础
          产业作用: 为AI终端、边缘设备和部分工业控制场景提供非易失存储与控制芯片
          确定性: 中
