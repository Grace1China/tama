    弹性因子:
    - AI Phone旗舰机VC面积、厚度和层数升级
    - AIPC轻薄本提高热管、VC、风扇和导热结构复杂度
    - 高性能平板、游戏手机和折叠屏提升均热需求
    - 超薄VC良率、产能利用率和客户认证节奏
