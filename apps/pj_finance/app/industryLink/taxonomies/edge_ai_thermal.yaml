上游_材料与基础工艺:
  高导热石墨与碳基材料:
    产业位置: 端侧AI热管理的轻薄热扩散基础材料，承担手机、平板、AI眼镜和轻薄本中热点摊平与机身热扩散
    确定性: 高
    弹性: 中高
    弹性因子:
    - AI Phone和AI眼镜常驻AI任务提升热扩散面积
    - 折叠屏、轻薄化和高屏占比压缩传统散热空间
    - 高导热人工石墨、复合石墨膜和多层材料升级
    - 消费电子客户认证、价格年降和石墨化良率
    公司:
    - 中石科技:
        info:
          入选说明: 导热材料和电磁屏蔽材料公司，人工石墨、导热垫片等产品与端侧AI热扩散直接相关
          产业作用: 为手机、平板、AI终端提供石墨散热片、导热材料和热扩散组件
          确定性: 高
          弹性: 中高
          理由:
          - 消费电子热管理产品基础较深
          - AI Phone和AI眼镜轻薄化有望提升石墨材料面积和层数
          - 可同时受益手机、服务器和汽车电子热管理需求
          风险:
          - 石墨片行业成熟，价格年降明显
          - 客户新品导入和份额变化会影响订单弹性
        link:
          飞荣达: 导热材料和散热模组协同
          思泉新材: 人工石墨材料同业
          歌尔股份: AI眼镜和可穿戴终端需求方向
    - 思泉新材:
        info:
          入选说明: 热管理材料公司，人工石墨散热膜、导热垫片等产品面向消费电子
          产业作用: 为手机、平板、笔电和可穿戴设备提供轻薄热扩散材料
          确定性: 中高
          弹性: 高
          理由:
          - 业务更聚焦热管理材料，对端侧散热主题敏感度较高
          - AI Phone和可穿戴设备放量时，小市值材料公司利润弹性更大
          - 复合石墨膜和导热材料升级可提升单机价值量
          风险:
          - 客户集中和消费电子出货波动
          - 新股估值和订单兑现节奏波动较大
        link:
          中石科技: 人工石墨和导热材料同业
          飞荣达: 热管理方案协同
          传音控股: 手机终端需求方向
    - 碳元科技:
        info:
          入选说明: 碳基热管理材料公司，早期以高导热石墨散热材料为核心
          产业作用: 为消费电子和终端设备提供石墨散热材料及相关热扩散方案
          确定性: 中
          弹性: 中高
          理由:
          - 碳基材料与端侧轻薄散热方向匹配
          - 行业景气修复时小体量公司弹性较高
          风险:
          - 经营质量和客户结构需持续验证
          - 主流客户份额和盈利稳定性不如头部公司
        link:
          中石科技: 石墨散热材料同业
          思泉新材: 碳基热管理材料同业
          蓝思科技: 消费电子结构件协同

  导热填料与胶黏剂基材:
    产业位置: 导热界面材料的配方源头，通过硅基、环氧、丙烯酸等基体和高导热填料降低芯片到结构件之间的接触热阻
    确定性: 高
    弹性: 中高
    弹性因子:
    - CPU、GPU、NPU多热源增加导热界面数量
    - 导热凝胶、相变材料、灌封胶和导热胶升级
    - 手机、AIPC、服务器、汽车电子多场景共振
    - 高导热、低泵出、低挥发和长期可靠性认证
    公司:
    - 回天新材:
        info:
          入选说明: 胶粘剂平台型公司，电子胶、导热胶和新能源胶类产品覆盖多个高可靠场景
          产业作用: 提供导热胶、灌封胶、结构胶等界面和封装材料，降低热源到散热结构的热阻
          确定性: 中高
          弹性: 中高
          理由:
          - 导热界面材料适用范围广，手机、AIPC、汽车电子均可受益
          - 胶粘剂配方和客户认证形成一定壁垒
          - 新能源和电子材料业务提供多场景需求支撑
          风险:
          - 端侧AI手机直接收入占比需要订单验证
          - 原材料价格和竞争加剧会压缩毛利率
        link:
          硅宝科技: 有机硅材料同业
          飞荣达: 导热材料客户和方案协同
          立讯精密: 终端制造需求方向
    - 硅宝科技:
        info:
          入选说明: 有机硅材料公司，电子胶、导热胶、密封胶等产品可用于电子和新能源场景
          产业作用: 提供有机硅基导热和密封材料，为电子设备热管理和可靠性提供材料基础
          确定性: 中
          弹性: 中
          理由:
          - 有机硅材料是导热界面和电子胶的重要基体
          - 电子、新能源和建筑胶多业务提供稳定支撑
          - 高导热电子胶升级可带来产品结构改善
          风险:
          - 端侧AI映射较间接，需看电子胶业务占比
          - 有机硅原材料价格周期影响盈利
        link:
          回天新材: 胶粘剂和导热胶同业
          中石科技: 导热材料协同
          闻泰科技: 终端制造需求方向
    - 斯迪克:
        info:
          入选说明: 功能性涂层复合材料公司，产品覆盖电子级胶膜、功能膜和新能源材料
          产业作用: 提供导热、粘接、绝缘和复合功能膜材料，服务消费电子和新能源设备
          确定性: 中
          弹性: 中高
          理由:
          - 功能膜和胶膜材料可向端侧散热、粘接和绝缘场景扩展
          - 消费电子复苏和AI终端升级可改善材料需求
          - 多业务平台对新品导入有弹性
          风险:
          - 导热材料纯度不如专业热管理公司
          - 客户认证和价格竞争影响利润兑现
        link:
          安洁科技: 消费电子功能件协同
          回天新材: 胶粘材料协同
          领益智造: 终端功能件需求方向

  VC均热板材料与精密加工:
    产业位置: VC均热板和热管的精密制造基础，围绕铜材、毛细结构、蚀刻、焊接、真空封装和超薄化工艺解决高热流密度热点
    确定性: 中高
    弹性: 高
    弹性因子:
    - 高端AI Phone扩大VC面积和渗透率
    - 轻薄AIPC从热管升级到VC或复合均热模组
    - 超薄VC、3D VC、毛细结构和焊接良率提升
    - 客户导入、价格年降和产能利用率变化
    公司:
    - 飞荣达:
        info:
          入选说明: 电磁屏蔽和热管理平台公司，覆盖导热材料、热管、VC和散热模组方向
          产业作用: 为AI Phone、AIPC、服务器和汽车电子提供VC、热管、导热材料和综合散热方案
          确定性: 中高
          弹性: 高
          理由:
          - VC和热管理模组单机价值量高于普通石墨片
          - 高端手机和轻薄AIPC升级可直接提升单机散热价值量
          - 公司产品线覆盖材料和模组，能承接一体化方案需求
          风险:
          - VC渗透率主要集中高端机型，普及节奏不确定
          - 良率、客户认证和价格年降影响盈利弹性
        link:
          中石科技: 导热材料协同
          领益智造: 终端结构件和散热模组协同
          立讯精密: 终端制造需求方向
    - 领益智造:
        info:
          入选说明: 消费电子精密功能件和结构件龙头之一，散热、屏蔽、金属件等能力与端侧热管理相邻
          产业作用: 为手机、平板、笔电和可穿戴提供结构件、功能件和散热相关组件
          确定性: 中高
          弹性: 中高
          理由:
          - 消费电子大客户基础强，能承接整机散热结构升级
          - AI终端复杂度提升带来结构件和功能件价值量提升
          - 散热、屏蔽和精密加工能力可组合成系统方案
          风险:
          - 公司体量较大，热管理单项业务利润弹性被摊薄
          - 消费电子客户价格年降压力明显
        link:
          飞荣达: 热管理模组协同
          安洁科技: 消费电子功能件同业
          立讯精密: 大客户组装和供应链协同
    - 安洁科技:
        info:
          入选说明: 消费电子功能件公司，覆盖粘接、绝缘、屏蔽、散热和精密模切等方向
          产业作用: 为手机、平板、可穿戴和汽车电子提供散热与功能复合组件
          确定性: 中
          弹性: 中高
          理由:
          - 功能件贴近整机热管理和空间设计
          - AI终端内部组件密度提升会增加复合功能材料需求
          - 可同时受益消费电子和汽车电子热管理
          风险:
          - 产品单价和客户份额波动
          - 热管理业务纯度需结合订单跟踪
        link:
          领益智造: 消费电子功能件同业
          斯迪克: 功能膜和胶膜协同
          歌尔股份: 可穿戴终端需求方向

中游_散热材料与模组:
  石墨散热片与复合热扩散膜:
    产业位置: 将碳基材料加工为可贴装、可模切、可复合的终端热扩散部件，是端侧AI热管理中确定性较高的基础层
    确定性: 高
    弹性: 中高
    弹性因子:
    - 端侧AI常驻任务增加热扩散面积和层数
    - 手机、平板、折叠屏和AI眼镜对轻薄柔性散热依赖提升
    - 石墨铜箔、石墨泡棉、石墨+胶膜等复合材料升级
    - 客户份额、模切良率和价格年降
    公司:
    - 中石科技:
        info:
          入选说明: 人工石墨和导热材料供应商，热扩散材料是端侧AI散热基础环节
          产业作用: 将石墨、导热垫片和复合材料交付给手机、平板、笔电和可穿戴客户
          确定性: 高
          弹性: 中高
          理由:
          - 石墨热扩散是手机和可穿戴的基础配置，需求确定性较强
          - AI功能常驻化提升热点数量和散热面积需求
          - 复合材料方案有望提升单机价值量
          风险:
          - 成熟品类价格竞争强
          - 高端新品份额和客户导入不确定
        link:
          思泉新材: 石墨散热材料同业
          飞荣达: 导热材料和模组协同
          蓝思科技: 终端结构件协同
    - 思泉新材:
        info:
          入选说明: 人工石墨散热膜和热管理材料公司，端侧AI轻薄散热弹性较高
          产业作用: 提供可模切、可复合的热扩散材料，用于手机、平板和可穿戴设备
          确定性: 中高
          弹性: 高
          理由:
          - 业务纯度较高，AI Phone散热升级对业绩敏感
          - 轻薄可穿戴设备对柔性热扩散材料需求明确
          - 新客户和新机型导入可带来阶段性高弹性
          风险:
          - 客户集中度和单一产品价格波动
          - 消费电子需求弱时订单恢复不确定
        link:
          中石科技: 石墨散热材料同业
          安洁科技: 功能件和模切协同
          传音控股: 手机出货需求方向
    - 道明光学:
        info:
          入选说明: 功能膜材料公司，部分产品与消费电子热管理、反射和复合膜材方向相关
          产业作用: 提供功能膜和复合材料能力，可作为终端散热、显示和结构材料的补充环节
          确定性: 中
          弹性: 中
          理由:
          - 功能膜材料具备向终端热管理复合膜扩展的潜力
          - 消费电子复苏和材料升级可带来边际弹性
          风险:
          - 端侧散热收入映射较间接
          - 主业多元，热管理贡献需要具体订单验证
