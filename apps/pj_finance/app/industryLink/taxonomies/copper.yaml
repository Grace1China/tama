中游_冶炼与循环:
  铜冶炼与电解铜:
    产业位置: 将铜精矿、粗铜和再生铜转化为电解铜的中枢环节，连接上游矿山和下游电力、电子、新能源材料需求
    确定性: 高
    弹性: 中
    弹性因子:
    - 铜精矿加工费TC/RC和原料供应紧张程度
    - 铜价波动带来的库存收益或跌价损失
    - 电解铜、硫酸、贵金属副产品价格变化
    - 冶炼产能利用率、环保约束和能源成本
    公司:
    - 江西铜业:
        info:
          入选说明: 国内铜冶炼和铜资源龙头之一，兼具矿山、冶炼和铜加工能力
          产业作用: 提供电解铜、铜杆线和铜加工产品，是国内铜产业链核心平台
          确定性: 高
          弹性: 中高
          理由:
          - 资源、冶炼和加工一体化增强产业链地位
          - 铜价上涨、库存收益和副产品价格可改善盈利
          - 电网和新能源用铜增长支撑长期需求
          风险:
          - 冶炼加工费下降会压缩冶炼利润
          - 公司体量大，铜价弹性被冶炼加工业务稀释
        link:
          紫金矿业: 铜资源同业
          铜陵有色: 铜冶炼同业
          海亮股份: 铜加工下游需求
    - 铜陵有色:
        info:
          入选说明: 铜冶炼和铜加工大型企业，电解铜、铜箔、铜板带等业务覆盖较全
          产业作用: 连接铜矿原料、冶炼、电解铜和铜加工，是铜产业链中游重要公司
          确定性: 高
          弹性: 中高
          理由:
          - 铜冶炼和铜加工规模较大，受益铜需求稳定增长
          - 铜箔和铜加工业务可向新能源和电子材料延伸
          - 铜价和加工费变化会影响利润弹性
          风险:
          - 冶炼端加工费和能源环保成本波动
          - 加工业务竞争激烈，毛利率弹性有限
        link:
          江西铜业: 铜冶炼同业
          铜冠铜箔: 铜箔业务协同
          楚江新材: 铜加工同业
    - 云南铜业:
        info:
          入选说明: 以铜冶炼为主的公司，具备电解铜和贵金属副产品业务
          产业作用: 将铜精矿加工为电解铜，向电力、电子和材料端提供基础铜原料
          确定性: 中高
          弹性: 中
          理由:
          - 电解铜需求受电网、新能源和制造业支撑
          - 副产品和库存收益在铜价上行期改善盈利
