  再生铜与城市矿山:
    产业位置: 铜供给的重要补充环节，通过废铜回收、拆解和再生冶炼降低原生矿依赖，提升铜资源循环利用率
    确定性: 中高
    弹性: 中
    弹性因子:
    - 废铜进口、回收政策和再生资源体系建设
    - 铜价高位提升废铜回收经济性
    - 电网、家电、汽车和电子产品报废周期
    - 再生铜品质、环保资质和税收政策变化
    公司:
    - 格林美:
        info:
          入选说明: 再生资源和新能源材料公司，城市矿山回收体系覆盖铜、镍、钴等多金属
          产业作用: 通过电子废弃物和动力电池回收提供再生金属资源，间接补充铜供给
          确定性: 中
          弹性: 中
          理由:
          - 再生资源体系建设提升长期确定性
          - 铜价和多金属价格上行有利于回收经济性
          - 电池回收和城市矿山形成多金属协同
          风险:
          - 铜并非公司单一主线，弹性被新能源材料业务分散
          - 回收渠道、价格和政策影响利润
        link:
          铜陵有色: 再生铜和冶炼协同
          华友钴业: 电池回收和金属材料协同
          楚江新材: 铜加工和再生材料协同
    - 楚江新材:
        info:
          入选说明: 铜基材料和高端铜合金加工公司，兼具材料加工和部分再生资源利用能力
          产业作用: 将铜原料加工为板带、线材和铜合金材料，连接冶炼和终端制造
          确定性: 中高
          弹性: 中高
          理由:
          - 铜基材料广泛用于电力电子、新能源车和高端装备
          - 加工费和产品结构升级决定盈利弹性
          - 铜价高位时库存和订单管理能力重要
          风险:
          - 铜加工行业竞争充分，毛利率受加工费约束
          - 铜价剧烈波动会影响库存和客户订单
        link:
