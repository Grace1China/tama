  铜矿服务与海外开发:
    产业位置: 铜矿扩产、深部开采和海外矿山建设的工程服务层，影响新增供给释放速度和矿山成本控制
    确定性: 中高
    弹性: 中高
    弹性因子:
    - 全球铜矿资本开支和矿山建设周期
    - 非洲、南美和中亚矿山开发带来的工程服务需求
    - 深部开采、智能矿山和安全环保要求提高
    - 铜价上行推动矿企增加勘探和扩产投入
    公司:
    - 金诚信:
        info:
          入选说明: 矿山开发服务和资源开发公司，海外矿山工程经验丰富
          产业作用: 为铜、金、铅锌等矿山提供建设、采矿运营和开发服务，间接受益铜矿资本开支
          确定性: 中高
          弹性: 中高
          理由:
          - 铜价高位时矿企扩产和建设意愿提升
          - 海外矿山服务能力形成差异化壁垒
          - 资源开发业务可能增强长期成长弹性
          风险:
          - 工程项目回款、海外安全和汇率风险
          - 并非纯铜资源公司，铜价传导较间接
        link:
