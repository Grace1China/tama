上游_矿山与资源:
  铜矿资源与伴生金属:
    产业位置: 铜产业链利润弹性的源头，决定矿端供给、资源储量、品位、成本曲线和铜价上涨时的利润释放能力
    确定性: 高
    弹性: 高
    弹性因子:
    - 电网、AIDC、新能源车、光伏风电和工业电气化带动长期铜需求
    - 全球新矿开发周期长、矿石品位下降和社区环保审批约束
    - 南美、非洲等主产区供应扰动和铜精矿加工费变化
    - 铜价上涨时矿山利润对价格变化高度敏感
    公司:
    - 紫金矿业:
        info:
          入选说明: 全球化矿业龙头，铜、金等资源储量和产量规模大，具备持续并购和项目开发能力
          产业作用: 提供铜矿资源和铜精矿，是铜价上行周期中资源端利润弹性的核心公司
          确定性: 高
          弹性: 高
          理由:
          - 铜资源布局全球化，矿山开发和运营能力强
          - 铜和黄金双主线提升资源平台确定性
          - 新能源、电网和数据中心用铜增长会向资源端传导
          风险:
          - 海外矿山所在国政策、税费和社区风险
          - 铜价和金价周期波动影响利润
        link:
          江西铜业: 铜资源与冶炼协同
          洛阳钼业: 海外铜资源同业
          铜陵有色: 铜冶炼和铜加工同业
    - 洛阳钼业:
        info:
          入选说明: 拥有刚果金铜钴资源和国内钼钨资源，多金属资源属性强
          产业作用: 提供海外铜资源和铜钴产品，是铜、钴、钼等战略金属供给端公司
          确定性: 高
          弹性: 高
          理由:
          - 刚果金铜资源规模大，铜价上行时业绩弹性强
          - 铜钴钼多金属组合受益电气化和高端制造需求
          - 海外项目扩产兑现可提升产量和成本优势
          风险:
          - 刚果金政策、税费、运输和社区风险较高
          - 钴价和铜价波动会放大业绩波动
        link:
          紫金矿业: 海外资源开发同业
          金钼股份: 钼资源同业
          华友钴业: 钴资源和材料协同
    - 西部矿业:
        info:
          入选说明: 铜、铅、锌等多金属资源公司，具备矿山和冶炼一体化基础
          产业作用: 提供铜精矿和多金属资源，承接铜价和铅锌价格弹性
          确定性: 中高
          弹性: 中高
          理由:
          - 多金属资源组合提升周期弹性
          - 铜资源和冶炼业务可受益电气化需求
          - 公司体量适中，资源价格变化对利润影响较明显
          风险:
          - 多金属价格共振下行时业绩承压
          - 矿山品位、成本和安全环保影响盈利
        link:
