上游_材料与核心部件:
  取向硅钢与铁芯材料:
    产业位置: 变压器磁路和损耗控制的源头，决定空载损耗、能效等级、噪声和高端变压器成本基础
    确定性: 高
    弹性: 中高
    弹性因子:
    - 电网高能效变压器更新和节能标准提升
    - AIDC、储能、新能源升压站提升高效铁芯需求
    - 取向硅钢价格、供需和高牌号产品占比变化
    - 非晶合金、低损耗材料替代进度
    公司:
    - 宝钢股份:
        info:
          入选说明: 国内取向硅钢龙头之一，高牌号硅钢是高效变压器铁芯关键材料
          产业作用: 为大型电力变压器、配电变压器和高能效变压器提供核心磁性材料
          确定性: 高
          弹性: 中
          理由:
          - 取向硅钢是变压器能效升级的基础材料
          - 高牌号产品具备技术和规模壁垒
          - 电网和AIDC建设会传导到硅钢需求
          风险:
          - 公司体量大，变压器硅钢弹性被钢铁主业摊薄
          - 钢价周期和原料价格影响盈利
        link:
          特变电工: 大型变压器材料需求
          中国西电: 电力装备材料需求
          望变电气: 硅钢和变压器产业协同
    - 首钢股份:
        info:
          入选说明: 具备电工钢和高端钢材能力，取向硅钢可用于变压器铁芯
          产业作用: 为配电变压器和电力装备提供电工钢材料
          确定性: 中高
          弹性: 中
          理由:
          - 电工钢受益高效电机和高效变压器升级
          - 取向硅钢供需改善时具备利润弹性
          - 电网投资和新能源接入提供需求支撑
          风险:
          - 钢铁主业周期掩盖电工钢弹性
          - 高端牌号份额和盈利需持续跟踪
        link:
          宝钢股份: 电工钢同业
          望变电气: 硅钢下游需求
          金盘科技: 干式变压器材料需求
    - 望变电气:
        info:
          入选说明: 兼具取向硅钢和变压器业务的公司，材料端和设备端协同度较高
          产业作用: 为变压器铁芯和成套变压器提供硅钢材料及制造能力
          确定性: 中高
          弹性: 高
          理由:
          - 同时受益取向硅钢景气和变压器需求增长
          - 小体量标的对电力设备周期更敏感
          - AIDC和配网投资扩张时订单弹性较强
          风险:
          - 硅钢价格波动会影响毛利率
          - 变压器竞争和产能利用率影响利润释放
        link:
          宝钢股份: 取向硅钢同业
          金盘科技: 变压器同业
          三变科技: 配电变压器同业
    - 云路股份:
        info:
          入选说明: 非晶合金材料代表公司，非晶合金可用于低损耗配电变压器铁芯
          产业作用: 提供非晶合金带材，支撑高能效、低损耗配电变压器升级
          确定性: 中
          弹性: 中高
          理由:
          - 节能变压器和能效标准提升有利于非晶材料应用
          - 配网更新和海外节能需求可带来增量
          - 非晶材料具备差异化技术路线
          风险:
          - 非晶变压器渗透率受成本和工艺约束
          - 应用节奏可能慢于取向硅钢主线
