    弹性: 高
    弹性因子:
    - 锂价上行带来利润弹性和库存重估
    - 资源自给率、低成本矿权和产能释放节奏
    - 动力电池与储能装机需求
    - 海外资源项目审批、汇率和政策变化
    公司:
    - 天齐锂业:
        info:
          入选说明: 全球锂资源龙头之一，权益资源和锂盐加工能力突出
          产业作用: 提供锂精矿、碳酸锂和氢氧化锂等核心原料
          确定性: 高
          弹性: 高
          理由:
          - 资源禀赋强，锂价上行时利润弹性大
          - 与下游正极、电池需求高度相关
          风险:
          - 锂价周期下行会显著压缩盈利
          - 海外资源、汇率和权益投资波动影响较大
        link:
          赣锋锂业: 锂资源和锂盐同业
          宁德时代: 下游动力电池需求
          容百科技: 正极材料需求传导
          比亚迪: 动力电池和整车需求
    - 赣锋锂业:
        info:
          入选说明: 锂资源、锂盐、金属锂和电池回收一体化公司
          产业作用: 覆盖锂资源获取、锂盐加工和下游材料配套
          确定性: 高
          弹性: 高
          理由:
          - 资源和加工链条较完整，海外布局广
          - 锂价上行与新能源需求恢复时弹性较强
          风险:
          - 资源项目建设、审批和海外经营存在不确定性
          - 锂价周期会影响估值和利润
