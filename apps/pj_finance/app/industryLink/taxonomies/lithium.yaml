        info:
          入选说明: 国内盐湖锂资源代表公司，钾肥主业提供现金流基础
          产业作用: 从盐湖卤水中提取碳酸锂，提供国内锂资源供给
          确定性: 中高
          弹性: 高
          理由:
          - 盐湖资源具备成本优势和长期供给价值
