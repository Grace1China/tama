  光芯片与激光器:
    产业位置: 光通信链条的发光、探测和调制源头，决定高速光模块成本、功耗、良率和国产替代上限
    确定性: 高
    弹性: 高
    弹性因子:
      - 800G、1.6T和3.2T光模块升级节奏
      - 国产光芯片在高端速率的突破进度
      - 海外云厂商资本开支和AI集群建设
      - 激光器良率、单通道速率和封装集成度
    公司:
      - 源杰科技:
          info:
            入选说明: 光芯片公司，覆盖高速激光器芯片方向，是光模块国产化的关键上游
            产业作用: 为高速光模块提供激光器芯片，决定发光端性能和成本
            产品: DFB、EML激光器芯片与硅光用大功率CW光源，覆盖2.5G至200G及更高速率，功率覆盖50mW、70mW、100mW；应用于PON/5G前传、400G/800G/1.6T数据中心光模块，并布局1550nm车载激光雷达光源。依据：2025年报P13-P14。
            确定性: 中高
            弹性: 高
            理由:
              - 高速光模块放量提升光芯片需求
              - 国产替代和高端速率突破带来业绩弹性
            风险:
              - 高端产品客户导入和良率爬坡不及预期
              - 海外头部供应商竞争
            成长性: 2025年营收6.01亿元，同比增长138.50%；归母净利润1.91亿元，较2024年亏损0.06亿元实现扭亏，不能用负基数同比百分比衡量。增长主要来自数据中心产品放量：数通销售占比已超过50%，硅光方案所需大功率CW芯片实现大批量出货；经营现金流1.50亿元，同比增长692%。依据：2025年报P9、P18。
            行业空间: 需求形成“AI数通高增长+电信平稳升级”双主线。公司年报称2025年1.6T光模块已批量出货、2026年进入商业化放量期，硅光渗透推动CW光源需求；50G PON与5G-A则提供较稳定的电信需求。剑桥科技2025年报P34引用LightCounting数据：2025年全球光模块及相关产品销售额238亿美元，同比增长55%。源杰的弹性集中在高速光芯片国产替代，空间大但受技术路线和客户份额约束。
            护城河: 核心是IDM全流程能力与量产验证，而非单一产品概念。公司覆盖芯片设计、MOCVD外延、光栅/波导、金属化、镀膜、自动化及可靠性测试，可缩短迭代周期并控制良率；2025年大功率CW产品已实现批量出货，说明部分能力已从研发跨越到规模交付。依据：2025年报P13、P15、P17。
            技术壁垒: 壁垒来自化合物半导体外延与多工序协同：高速EML需完成量子阱、光栅、波导、高频电极和调制区集成；大功率CW需同时解决高功率、耦合效率、温度稳定性和长期可靠性。公司已形成100G/200G PAM4 EML、异质材料对接生长、相移光栅、掩埋型/脊波导平台及光放大器集成等技术，200G PAM4 EML处于国际少数厂商行列。依据：2025年报P16、P20-P24。
          link:
            中际旭创: 高速光模块客户方向
            新易盛: 高速光模块客户方向
            光迅科技: 光芯片和模块平台协同
