          凯立新材: 催化材料协同

下游_消费与金融属性:
  黄金珠宝与投资金:
    产业位置: 将黄金原料转化为珠宝首饰、投资金条和品牌零售产品，连接金价、消费需求、渠道库存和品牌溢价
    确定性: 中高
    弹性: 中
    弹性因子:
    - 金价上涨对投资金需求和黄金首饰消费的双向影响
    - 加盟渠道扩张、同店销售、产品工费和周转效率
    - 消费景气、婚庆需求和节日促销
    - 库存成本、套保策略和终端提价能力
    公司:
    - 老凤祥:
        info:
          入选说明: 黄金珠宝老牌企业，品牌认知和渠道基础较强
          产业作用: 将黄金原料转化为首饰、工艺品和投资金产品，承接终端消费和保值需求
          确定性: 高
          弹性: 中
          理由:
          - 品牌和渠道优势提升黄金消费承接能力
          - 金价上涨初期可能刺激保值和投资需求
          - 工费、产品结构和周转效率决定盈利质量
          风险:
          - 金价过快上涨可能压制首饰消费
          - 加盟渠道库存和终端动销需要持续跟踪
        link:
          中国黄金: 黄金珠宝同业
          周大生: 珠宝零售同业
          菜百股份: 黄金零售同业
    - 中国黄金:
        info:
          入选说明: 中国黄金集团旗下黄金珠宝零售平台，投资金和黄金产品品牌识别度高
          产业作用: 面向终端消费者销售黄金珠宝、投资金条和相关产品
          确定性: 中高
          弹性: 中
          理由:
          - 黄金品牌背书和渠道网络支撑销售规模
          - 投资金产品受益避险和保值需求
          - 轻资产加盟模式对渠道扩张敏感
          风险:
          - 毛利率受产品结构和金价波动影响
          - 高金价可能压制首饰类消费
        link:
          老凤祥: 黄金珠宝同业
          中金黄金: 集团资源上游
          周大生: 珠宝零售同业
    - 周大生:
        info:
          入选说明: 珠宝零售龙头之一，渠道和品牌运营能力较强，黄金产品是重要品类
          产业作用: 通过加盟和直营渠道销售黄金、镶嵌和时尚珠宝
          确定性: 中高
          弹性: 中
          理由:
