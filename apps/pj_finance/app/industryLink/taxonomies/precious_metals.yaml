上游_资源与矿山:
  黄金矿山与资源开发:
    产业位置: 贵金属产业链利润弹性的源头，决定黄金资源储量、矿山品位、产量增长、成本曲线和金价上涨时的业绩释放能力
    确定性: 高
    弹性: 高
    弹性因子:
    - 金价、实际利率、美元指数和全球央行购金变化
    - 矿山资源储量、品位、采选成本和增储扩产进度
    - 海外矿山所在国政策、税费、社区和汇率风险
    - 套保比例、矿山产量和单位成本对金价弹性的影响
    公司:
    - 紫金矿业:
        info:
          入选说明: 全球化矿业龙头，黄金、铜等资源储量和产量规模领先，具备持续并购和项目开发能力
          产业作用: 提供黄金矿产资源和矿山运营能力，是金价上行周期中资源端弹性的核心公司之一
          确定性: 高
          弹性: 高
          理由:
          - 黄金和铜双资源主线增强盈利弹性
          - 全球矿山开发和并购能力强，资源储量基础深
          - 金价上行时矿山利润对价格变化敏感
          风险:
          - 海外矿山政策、税费和社区风险
          - 铜价等其他金属周期会影响估值归因
        link:
          山东黄金: 黄金矿山同业
          赤峰黄金: 海外黄金资源同业
          江西铜业: 铜金资源协同
    - 山东黄金:
        info:
          入选说明: 国内黄金矿业龙头之一，黄金资源储量和产量规模大，主业纯度较高
          产业作用: 通过黄金矿山采选和冶炼提供矿产金，是金价弹性较直接的资源公司
          确定性: 高
          弹性: 高
          理由:
          - 黄金主业纯度高，金价变化对盈利传导直接
          - 国内优质黄金资源储备较强
          - 增储扩产和成本控制决定利润释放斜率
          风险:
          - 矿山品位、采矿成本和安全环保影响盈利
          - 金价高位回落会压缩业绩弹性
        link:
          紫金矿业: 黄金资源同业
          中金黄金: 国内黄金矿山同业
          银泰黄金: 黄金资源同业
    - 中金黄金:
        info:
          入选说明: 中国黄金集团旗下黄金上市平台，覆盖黄金采选、冶炼和销售
          产业作用: 提供矿产金和黄金冶炼能力，承接金价上涨带来的资源端利润弹性
          确定性: 高
          弹性: 中高
          理由:
          - 央企黄金平台具备资源整合和项目开发基础
          - 金价上行改善矿山盈利和资源价值
          - 冶炼与矿山业务形成产业链协同
          风险:
          - 资源品位和成本曲线影响盈利弹性
          - 冶炼业务会摊薄纯资源弹性
        link:
          山东黄金: 黄金资源同业
          中国黄金: 集团体系和下游品牌关联
          湖南黄金: 黄金锑资源同业
    - 赤峰黄金:
        info:
          入选说明: 黄金资源公司，拥有境内外黄金矿山，金价弹性和海外资源属性较强
          产业作用: 提供矿产金产量和海外黄金资源开发能力
          确定性: 中高
          弹性: 高
          理由:
          - 黄金主线清晰，金价上涨时利润弹性较强
          - 海外矿山产量和成本改善可放大业绩弹性
          - 资源扩张和项目运营效率是重要跟踪点
          风险:
          - 海外矿山政治、税费、汇率和运营风险
          - 项目产量或成本不及预期
        link:
          紫金矿业: 海外资源开发同业
          山东黄金: 黄金矿山同业
          银泰黄金: 黄金资源同业
    - 银泰黄金:
        info:
          入选说明: 黄金资源公司，兼具黄金和多金属资源属性，黄金业务对金价敏感
          产业作用: 提供黄金矿山资源和矿产金产量，参与资源端利润分配
          确定性: 中高
          弹性: 高
          理由:
          - 黄金资源占比较高，金价弹性较直接
          - 多金属伴生资源提升综合盈利能力
          - 资源整合和产量增长有望提升估值弹性
          风险:
          - 矿山项目投产和产量释放节奏不确定
          - 金价和伴生金属价格波动影响利润
        link:
          山东黄金: 黄金资源同业
          赤峰黄金: 黄金资源同业
          湖南黄金: 黄金锑资源同业

  银铂钯与伴生贵金属资源:
    产业位置: 银、铂、钯及伴生贵金属资源环节，连接有色多金属矿山、冶炼副产品和工业贵金属需求
    确定性: 中高
    弹性: 中高
    弹性因子:
    - 白银价格、金银比、光伏银浆需求和工业用银景气
    - 铂钯价格、汽车尾气催化和氢能催化材料需求
    - 铅锌铜等主金属矿山的伴生贵金属回收率
    - 冶炼副产品价格、加工费和库存重估
    公司:
    - 湖南黄金:
        info:
          入选说明: 黄金、锑、钨等多金属资源公司，具备黄金和战略小金属复合属性
          产业作用: 提供黄金和锑等资源，承接贵金属和小金属价格弹性
          确定性: 中高
          弹性: 高
          理由:
          - 黄金资源受益金价上行
          - 锑等小金属供需变化提供额外弹性
          - 多金属组合增强主题和盈利弹性
          风险:
          - 锑价和金价共振回落时利润波动较大
          - 矿山安全环保和产量释放风险
        link:
          中金黄金: 黄金资源同业
          银泰黄金: 黄金多金属同业
          兴业银锡: 多金属资源同业
    - 兴业银锡:
        info:
          入选说明: 银、锡、铅锌等多金属资源公司，白银和锡价弹性较强
          产业作用: 提供银锡等多金属矿产资源，是白银价格和工业金属景气的弹性标的
          确定性: 中
          弹性: 高
          理由:
          - 白银兼具贵金属和工业金属属性
          - 锡和铅锌等多金属价格变化会放大业绩波动
          - 小体量资源公司对价格和产量变化敏感
          风险:
          - 多金属价格波动和矿山产量不确定
          - 白银主线会被锡、铅锌等业务分散
        link:
          盛达资源: 银铅锌资源同业
          湖南黄金: 多金属资源同业
          白银有色: 综合冶炼同业
    - 盛达资源:
        info:
          入选说明: 银铅锌资源公司，白银伴生资源属性突出
          产业作用: 提供银、铅、锌等矿产资源，承接白银价格和有色周期弹性
          确定性: 中
          弹性: 高
          理由:
          - 白银价格上行时资源端利润弹性较高
          - 银铅锌多金属组合可受益工业需求改善
          - 项目扩产和矿山品位变化影响业绩释放
          风险:
          - 铅锌价格和白银价格分化会影响估值主线
          - 矿山开发、审批和安全环保风险
        link:
          兴业银锡: 银铅锌资源同业
          白银有色: 银和有色冶炼协同
          西部矿业: 多金属资源同业
    - 西部矿业:
        info:
          入选说明: 铜、铅、锌等多金属资源公司，部分贵金属来自伴生回收
          产业作用: 通过多金属矿山和冶炼体系提供伴生贵金属和有色资源
          确定性: 中高
          弹性: 中
          理由:
          - 多金属资源组合受益有色价格周期
          - 伴生贵金属可在金银价格上行时改善副产品收益
          - 资源和冶炼一体化增强经营韧性
          风险:
          - 贵金属并非公司唯一主线，价格弹性被主金属稀释
          - 铜铅锌价格回落会压制利润
        link:
          紫金矿业: 多金属资源同业
          盛达资源: 银铅锌资源同业
          江西铜业: 铜资源协同

中游_冶炼回收与材料:
  贵金属冶炼与综合回收:
    产业位置: 将矿产金银、阳极泥、废催化剂和含贵金属物料转化为标准金属和化工材料，连接矿山资源、再生回收和下游加工
    确定性: 中高
    弹性: 中
    弹性因子:
    - 金银价格上涨带来的库存收益和副产品价值提升
    - 铜铅锌冶炼阳极泥中的金银回收率和加工费变化
    - 再生贵金属回收政策、环保资质和原料获取能力
    - 冶炼能源成本、环保约束和套保策略
    公司:
    - 恒邦股份:
        info:
          入选说明: 黄金冶炼和综合回收公司，具备贵金属冶炼加工和资源回收能力
          产业作用: 将含金银物料加工为标准贵金属产品，连接矿山、冶炼副产和下游消费
          确定性: 中高
          弹性: 中
          理由:
          - 金银价格上行可改善库存和副产品收益
          - 综合回收能力提升原料适配和加工收益
          - 黄金冶炼平台具备产业链中枢属性
          风险:
          - 冶炼加工费、原料采购和套保会影响价格弹性
          - 纯资源弹性弱于黄金矿山公司
        link:
          山东黄金: 黄金资源上游
          豫光金铅: 贵金属回收同业
          白银有色: 综合冶炼同业
    - 豫光金铅:
        info:
          入选说明: 铅锌冶炼和贵金属综合回收企业，金银等副产品回收能力较强
          产业作用: 通过铅锌冶炼和阳极泥处理回收金银等贵金属
          确定性: 中
          弹性: 中
          理由:
          - 金银价格上行提升副产品价值
          - 再生铅和综合回收业务具备循环经济属性
          - 原料结构和加工费变化影响盈利弹性
          风险:
          - 主业仍受铅锌价格和冶炼加工费影响
          - 环保、安全和能源成本约束较强
        link:
          恒邦股份: 贵金属回收同业
          白银有色: 综合冶炼同业
          盛达资源: 银铅锌资源上游
    - 白银有色:
        info:
          入选说明: 铜、铅、锌、贵金属等综合冶炼公司，具备有色冶炼平台属性
          产业作用: 通过综合冶炼和副产品回收参与金银等贵金属供给
          确定性: 中
          弹性: 中
          理由:
          - 综合冶炼副产品受益金银价格上涨
          - 多金属价格改善可提升整体盈利
          - 冶炼平台具备资源和加工协同
          风险:
          - 冶炼毛利受加工费、能源和环保成本约束
          - 贵金属弹性被铜铅锌等业务稀释
        link:
          豫光金铅: 综合冶炼同业
          兴业银锡: 银资源上游
          江西铜业: 铜冶炼协同

  贵金属功能材料:
    产业位置: 将铂、钯、铑、银等贵金属加工为催化剂、电子浆料、靶材和高端材料，连接资源回收与工业应用需求
    确定性: 中高
    弹性: 中高
    弹性因子:
    - 汽车尾气催化、化工催化和氢能催化需求变化
    - 光伏银浆、电子浆料和半导体靶材国产化进度
    - 贵金属原料价格波动、库存和加工价差
    - 回收闭环和高端材料认证进度
    公司:
    - 贵研铂业:
        info:
          入选说明: 贵金属材料和资源循环企业，覆盖铂族金属催化材料、回收和深加工
          产业作用: 为汽车尾气净化、化工催化、氢能和电子材料提供贵金属功能材料
          确定性: 中高
          弹性: 中高
          理由:
          - 铂族金属材料技术和回收闭环具备壁垒
          - 催化材料、氢能和工业材料需求提供成长空间
          - 贵金属价格和加工价差影响利润弹性
          风险:
          - 汽车催化需求受新能源车替代和排放政策影响
          - 原料价格波动和库存管理影响盈利
        link:
          凯立新材: 贵金属催化材料同业
          有研新材: 高端金属材料协同
          江丰电子: 靶材材料协同
    - 凯立新材:
        info:
          入选说明: 贵金属催化剂公司，产品用于精细化工、医药和新材料等催化反应
          产业作用: 将铂、钯等贵金属转化为高附加值催化材料
          确定性: 中
          弹性: 中高
          理由:
          - 贵金属催化剂具备技术壁垒和客户认证要求
          - 下游精细化工和新材料扩产带来催化剂需求
          - 回收再生能力有助于降低客户贵金属占用成本
          风险:
          - 下游化工资本开支周期影响订单
          - 贵金属价格波动会影响客户采购节奏和库存
        link:
          贵研铂业: 贵金属催化材料同业
          有研新材: 金属功能材料协同
          江丰电子: 高端材料国产化方向
    - 有研新材:
        info:
          入选说明: 高端金属材料平台，覆盖稀贵金属材料、电子材料和靶材方向
          产业作用: 为电子、半导体和高端制造提供稀贵金属及功能材料
          确定性: 中
          弹性: 中
          理由:
          - 高端材料国产替代和半导体材料需求提供长期空间
          - 稀贵金属材料与电子材料具备产业协同
          - 原料价格和产品结构变化会影响利润弹性
          风险:
          - 贵金属价格映射较间接
          - 半导体和电子材料认证周期较长
