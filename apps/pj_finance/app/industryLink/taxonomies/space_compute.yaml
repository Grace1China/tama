  辐射散热与热管理材料:
    产业位置: 太空算力最硬的工程约束之一，真空环境无法风冷，计算载荷热量主要依赖热管、两相回路、导热材料和辐射散热片排出
    确定性: 中
    弹性: 高
    弹性因子:
    - 百千瓦级算力载荷热耗散验证结果
    - 辐射散热片面积、质量和展开结构优化
    - 热管、两相流体回路、相变材料和高导热界面材料升级
    - 航天热控材料国产化和星载可靠性认证
    公司:
    - 飞荣达:
        info:
          入选说明: 电磁屏蔽、导热材料和结构件厂商，消费电子、通信和新能源热管理基础较强
          产业作用: 为高功率电子设备提供导热、屏蔽和结构材料能力，太空算力方向属于技术外溢和远期映射
          确定性: 中
          弹性: 中高
          理由:
          - 高功率算力载荷需要导热界面、屏蔽和结构材料协同
          - 公司热管理材料和通信设备客户基础可迁移到高可靠场景
          风险:
          - 航天级产品和太空算力收入不可验证
          - 主业受消费电子和通信周期影响
        link:
          中石科技: 导热材料同业
          英维克: 热管理系统协同
    - 中石科技:
        info:
          入选说明: 石墨散热、导热材料和电子热管理材料厂商
          产业作用: 为高功率电子设备提供导热和热扩散材料，太空场景更偏远期材料映射
          确定性: 中
          弹性: 中高
          理由:
          - 算力载荷功率密度提升会强化热扩散和导热材料需求
          - AI终端和数据中心热管理主线能提供更现实业绩支撑
          风险:
          - 太空辐射散热片和航天热控认证难度高
          - 现有收入与太空算力关联较弱
        link:
          飞荣达: 导热材料同业
          英维克: 热管理系统需求方向
    - 英维克:
        info:
          入选说明: 数据中心和储能温控龙头之一，液冷和热管理系统能力较强
          产业作用: 代表地面AIDC热管理工程能力，太空算力方向可作为高功率热管理技术外溢参考
          确定性: 高
          弹性: 中
