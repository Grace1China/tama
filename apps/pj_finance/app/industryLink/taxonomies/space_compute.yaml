上游_发射卫星平台与材料制造:
  可重复发射与航天先进制造:
    产业位置: 太空算力的成本底座，发射价格、运力、可重复使用火箭和复杂结构件制造能力决定算力卫星是否有规模化复制可能
    确定性: 中
    弹性: 高
    弹性因子:
    - Starship和国内可重复使用火箭验证进度
    - 单星重量、发射批量和入轨成本下降速度
    - 商业航天发射频次和星座补网节奏
    - 发动机、燃烧室、喷注器和轻量化结构件增材制造渗透率提升
    公司:
    - 铂力特:
        info:
          入选说明: 金属3D打印龙头，航空航天复杂结构件和增材制造设备具备较强产业基础
          产业作用: 为火箭发动机复杂件、卫星结构件和轻量化部件提供先进制造能力，是商业航天降本增效的重要工具
          确定性: 高
          弹性: 高
          理由:
          - 火箭发动机喷注器、燃烧室和复杂流道结构适合金属增材制造
          - 商业航天发射频次提升会放大复杂件小批量快速迭代需求
          - 公司航空航天客户基础较强，太空算力可作为远期叙事增强
          风险:
          - 太空算力卫星不是当前确定订单来源
          - 项目制订单节奏和验收周期波动较大
          - 估值容易提前反映长期空间
        link:
          华曙高科: 增材制造同业
          中国卫星: 卫星平台需求方向
          航天电子: 航天电子与结构配套
    - 华曙高科:
        info:
          入选说明: 工业级3D打印设备和材料厂商，可服务航天复杂件和轻量化制造场景
          产业作用: 提供工业增材制造设备、材料和工艺能力，支撑火箭与卫星制造环节的快速迭代
          确定性: 中高
          弹性: 中高
          理由:
          - 商业航天制造需要轻量化、复杂化和快速试制能力
          - 增材制造在航天小批量高性能零件中具备明确工程价值
          风险:
          - 航天客户和太空算力相关收入占比不透明
          - 设备销售受资本开支周期影响
        link:
          铂力特: 增材制造同业
          光威复材: 轻量化材料协同
    - 光威复材:
        info:
          入选说明: 高端碳纤维和复合材料代表公司，航空航天轻量化材料基础扎实
          产业作用: 为卫星平台、火箭结构和大型太阳翼支撑结构提供轻量化材料基础
          确定性: 高
          弹性: 中
          理由:
          - 太空算力卫星功率和散热面积提升，会增加结构轻量化要求
          - 碳纤维复合材料是航天器减重和提高发射经济性的关键材料
          风险:
          - 商业航天收入占比不清晰
          - 军工和航空主业周期对业绩影响更大
        link:
          中复神鹰: 碳纤维材料同业
          中国卫星: 卫星平台需求方向
    - 中复神鹰:
        info:
          入选说明: 国内碳纤维材料厂商，具备高性能碳纤维国产化基础
          产业作用: 为卫星结构件、太阳翼展开结构和航天轻量化材料提供潜在供应能力
          确定性: 中高
          弹性: 中
          理由:
          - 发射成本和载荷功率提升都会强化航天结构减重需求
          - 高性能碳纤维在航天、无人机和高端装备中长期空间较大
          风险:
          - 价格和产能释放影响盈利
          - 太空算力映射偏间接
        link:
          光威复材: 碳纤维材料同业

  高功率卫星平台与总装:
    产业位置: 承载算力载荷、太阳翼、储能、电源管理、热控和通信载荷的星体平台，是太空算力从概念走向工程验证的核心集成层
    确定性: 中高
    弹性: 高
    弹性因子:
    - 国内低轨星座发射和组网节奏
    - 单星功率从通信载荷向高功率计算载荷升级
    - 星上自治、边缘处理和遥感在轨计算需求提升
    - 高功率平台的姿控、热控、电源和可靠性验证结果
    公司:
    - 中国卫星:
        info:
          入选说明: 国内卫星研制和空间应用代表公司，具备卫星平台和空间系统产业基础
          产业作用: 负责卫星平台和载荷集成方向，是太空算力最需要验证的高功率星体平台映射标的
          确定性: 中高
          弹性: 中高
          理由:
          - 低轨卫星互联网和遥感卫星建设本身具备中长期需求
          - 太空算力需要更大功率、更强热控和更高可靠性的卫星平台
          - 若在轨计算载荷验证推进，平台方会先获得工程需求
          风险:
          - 太空数据中心仍处前沿验证期
          - 公司订单更多受国内航天任务和项目节奏影响
          - 商业化利润弹性不一定等同于主题弹性
        link:
          航天电子: 航天电子配套
          航天智装: 航天装备和测控协同
          中科星图: 下游空间数据应用
    - 航天电子:
        info:
          入选说明: 航天电子、测控通信、惯导和航天配套代表公司
          产业作用: 为卫星平台和载荷提供测控、通信、惯性导航和航天电子能力，支撑在轨可靠运行
          确定性: 中高
          弹性: 中
          理由:
          - 高功率算力卫星对测控通信、姿控和可靠电子系统要求更高
          - 国内星座建设和航天发射任务提供基础需求
          风险:
          - 太空算力不是当前单独披露业务
          - 主业项目制和特种业务属性较强
        link:
          中国卫星: 卫星平台协同
          航天电器: 高可靠连接器配套
          紫光国微: 高可靠芯片协同
    - 航天智装:
        info:
          入选说明: 航天装备、测控和智能装备方向公司，具备航天系统配套属性
          产业作用: 在卫星地面测控、航天装备和空间系统配套中提供辅助能力
          确定性: 中
          弹性: 中高
          理由:
          - 太空算力验证阶段需要地面测控、测试验证和航天装备配套
          - 主题弹性可能随国内星座和航天装备投资提升
          风险:
          - 基本面弹性需要订单验证
          - 太空算力映射较间接
        link:
          中国卫星: 卫星平台需求方向
          航天电子: 航天测控协同

