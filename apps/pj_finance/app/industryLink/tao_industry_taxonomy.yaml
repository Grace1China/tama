边缘支线_功能金刚石材料:
  金刚石热管理:
    产业位置: AI芯片、光模块、功率器件的高导热材料补强环节
    确定性: 中
    弹性: 中高
    公司:
    - 四方达:
        info:
          代码: 300179.SZ
          关联点: 培育钻石、CVD金刚石、超硬材料，具备向功能金刚石材料延伸的基础
          确定性: 中
          弹性: 中高
          理由:
          - CVD金刚石可用于高导热散热片、热沉材料
          - AI芯片、光模块、功率器件对高导热材料需求提升
          - 公司超硬材料基础较强，向功能金刚石延伸逻辑较顺
          风险:
          - 当前收入仍主要来自超硬材料和传统应用
          - 金刚石热管理收入占比不清晰
          - 需要验证客户导入和量产能力
    - 沃尔德:
        info:
          代码: 688028.SH
          关联点: 超高精密超硬刀具、CVD金刚石材料、金刚石功能材料布局
          确定性: 中
          弹性: 中
          理由:
          - 具备金刚石材料和加工能力
          - 功能金刚石可用于高功率器件和高端装备热管理
          - 公司精密加工和超硬材料能力有技术延展性
          风险:
          - 主业仍以刀具和超硬材料为主
          - 热管理应用商业化节奏不清晰
          - AI芯片散热收入暂难验证
    - 国机精工:
        info:
          代码: 002046.SZ
          关联点: 超硬材料、精密制造、金刚石工具和功能材料
          确定性: 中
          弹性: 中
          理由:
          - 超硬材料平台属性较强
          - 可向高导热金刚石材料、精密加工、半导体耗材延伸
          风险:
          - 公司业务较分散
          - 金刚石热管理并非当前核心收入
          - 弹性可能被传统业务稀释
    - 中兵红箭:
        info:
          代码: 000519.SZ
          关联点: 中南钻石，工业金刚石和培育钻石龙头之一
          确定性: 中
          弹性: 中
          理由:
          - 工业金刚石产能和技术基础较强
          - 若功能金刚石热管理材料放量，具备材料端延伸潜力
          风险:
          - 当前更多是工业金刚石/培育钻石周期逻辑
          - 功能金刚石收入占比不清晰
          - 不宜直接按AI芯片热管理核心材料估值
    - 力量钻石:
        info:
          代码: 301071.SZ
          关联点: 培育钻石、工业金刚石、金刚石单晶
          确定性: 中低
          弹性: 中
          理由:
          - 具备人造金刚石材料基础
          - 理论上可向高导热金刚石材料延伸
          风险:
          - 主业更偏培育钻石和工业金刚石
          - 消费级培育钻石价格周期影响大
          - 热管理材料客户和收入验证不足
    - 黄河旋风:
        info:
          代码: 600172.SH
          关联点: 超硬材料、培育钻石、人造金刚石
          确定性: 中低
          弹性: 中
          理由:
          - 人造金刚石产业基础较早
          - 具备功能金刚石材料的潜在转型方向
          风险:
          - 公司财务和盈利稳定性需谨慎
          - 热管理应用并非当前主线
          - 更偏概念映射
