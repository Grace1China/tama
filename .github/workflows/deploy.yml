# 部署：构建完成后推送到分支 pd_bible、pd_finance（pd=product），再把 pd_bible 同步到 Gitee
name: Deploy

# 推送到 main 或 master 时执行；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build & push to pd_bible / pd_finance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Remove pj_finance/temp for build
        run: rm -rf apps/pj_finance/temp

      - name: Build pj_bible
        run: npm run build:bible

      - name: Build pj_finance
        run: npm run build:finance

      - name: Save build artifacts
        run: |
          cp -r apps/pj_bible/.next /tmp/pd_bible_build
          cp -r apps/pj_finance/.next /tmp/pd_finance_build

      - name: Push pd_bible build to branch pd_bible
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pd_bible || true
          git checkout pd_bible 2>/dev/null || git checkout -B pd_bible
          rm -rf apps/pj_bible/.next
          cp -r /tmp/pd_bible_build apps/pj_bible/.next
          git add -f apps/pj_bible/.next
          git diff --staged --quiet || git commit -m "chore(deploy): pd_bible build $(date -u +%Y%m%d-%H%M%S)"
          git push --force https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:pd_bible
          git checkout -

      - name: Push pd_finance build to branch pd_finance
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin pd_finance || true
          git checkout pd_finance 2>/dev/null || git checkout -B pd_finance
          rm -rf apps/pj_finance/.next
          cp -r /tmp/pd_finance_build apps/pj_finance/.next
          git add -f apps/pj_finance/.next
          git diff --staged --quiet || git commit -m "chore(deploy): pd_finance build $(date -u +%Y%m%d-%H%M%S)"
          git push --force https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:pd_finance
          git checkout -

  # 可选：仅把 pd_bible 分支（含构建产物）同步到 Gitee，便于国内 clone
  # 需在 Secrets 添加 GITEE_TOKEN，Variables 添加 GITEE_REPO、GITEE_USER（Gitee 用户名）
  sync-gitee:
    name: Sync to Gitee
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.GITEE_REPO != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push to Gitee (仅 pd_bible 分支，含构建产物)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_USER: ${{ vars.GITEE_USER }}
        run: |
          [ -n "${GITEE_TOKEN}" ] || { echo "GITEE_TOKEN not set, skip sync"; exit 0; }
          [ -n "${GITEE_USER}" ] || { echo "GITEE_USER not set, skip sync (set Variables → GITEE_USER to your Gitee username)"; exit 0; }
          git config http.postBuffer 524288000
          GITEE_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git remote add gitee "${GITEE_URL}" 2>/dev/null || git remote set-url gitee "${GITEE_URL}"
          git push gitee "refs/remotes/origin/pd_bible:refs/heads/pd_bible" --force
      - name: Trigger pd_bible publish (pull from Gitee + pm2 restart on server)
        run: |
          curl -sf --max-time 60 "http://www.quanyuan.live/publishBook" || echo "Warning: publishBook call failed (server may run script separately)"

