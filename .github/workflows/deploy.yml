# 部署：构建 pj_finance + pj_bible，推送到单一分支 pd_tama
name: Deploy

# 推送到 main 或 master 时执行；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build & push to pd_tama
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Remove pj_finance/temp for build
        run: rm -rf apps/pj_finance/temp

      - name: Build pj_bible
        run: npm run build:bible

      - name: Build pj_finance
        run: npm run build:finance

      - name: Push build to pd_tama
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apps/pj_bible/.next apps/pj_finance/.next
          git diff --staged --quiet || git commit -m "chore(deploy): pj_bible + pj_finance build $(date -u +%Y%m%d-%H%M%S)"
          git push --force https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:pd_tama
