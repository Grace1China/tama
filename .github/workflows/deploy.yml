# 部署：构建 pj_bible 与 pj_finance，分别推送到分支 pj_bible、pj_finance
name: Deploy

# 推送到 main 或 master 时执行；也可在 Actions 页手动 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build & push to pj_bible / pj_finance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Remove pj_finance/temp for build
        run: rm -rf apps/pj_finance/temp

      - name: Build pj_bible
        run: npm run build:bible

      - name: Build pj_finance
        run: npm run build:finance

      - name: Save build artifacts
        run: |
          cp -r apps/pj_bible/.next /tmp/pj_bible_build
          cp -r apps/pj_finance/.next /tmp/pj_finance_build

      - name: Push pj_bible build to branch pj_bible
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pj_bible || true
          git checkout pj_bible 2>/dev/null || git checkout -B pj_bible
          rm -rf apps/pj_bible/.next
          cp -r /tmp/pj_bible_build apps/pj_bible/.next
          git add -f apps/pj_bible/.next
          git diff --staged --quiet || git commit -m "chore(deploy): pj_bible build $(date -u +%Y%m%d-%H%M%S)"
          git push --force https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:pj_bible
          git checkout -

      - name: Trigger pj_bible publish (pull + pm2 restart on server)
        run: |
          curl -sf --max-time 60 "http://www.quanyuan.live/publishBook" || echo "Warning: publishBook call failed (server may run script separately)"

      - name: Push pj_finance build to branch pj_finance
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin pj_finance || true
          git checkout pj_finance 2>/dev/null || git checkout -B pj_finance
          rm -rf apps/pj_finance/.next
          cp -r /tmp/pj_finance_build apps/pj_finance/.next
          git add -f apps/pj_finance/.next
          git diff --staged --quiet || git commit -m "chore(deploy): pj_finance build $(date -u +%Y%m%d-%H%M%S)"
          git push --force https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:pj_finance
          git checkout -
